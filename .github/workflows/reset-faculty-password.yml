name: Reset Faculty Password

on:
  workflow_dispatch:

jobs:
  reset-password:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Reset faculty password in Render PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url
          from app.security import hash_password

          raw_url = os.environ.get("DATABASE_URL", "")
          url = "".join(raw_url.split())

          if url.startswith("postgres://"):
              url = url.replace("postgres://", "postgresql://", 1)

          if not url:
              raise RuntimeError("DATABASE_URL secret is empty.")

          try:
              parsed = make_url(url)
          except Exception:
              raise RuntimeError(
                  "DATABASE_URL is malformed. Update it with the "
                  "complete Render External Database URL."
              ) from None

          if not parsed.host or not parsed.database:
              raise RuntimeError(
                  "DATABASE_URL is missing its database host or name."
              )

          print(
              f"Database URL format valid; driver={parsed.drivername}; "
              f"host_present={bool(parsed.host)}"
          )

          engine = create_engine(url, pool_pre_ping=True)
          
          try:
              with engine.connect() as conn:
              rows = conn.execute(
                text("""
                    SELECT email, role, is_active
                    FROM users
                    WHERE lower(email) LIKE '%faculty%'
                  """)
              ).fetchall()

              print("Matching faculty-related records:")
              for row in rows:
                  print(row)


              print("Faculty password reset completed.")
          finally:
              engine.dispose()
          PY
