
name: Check Faculty Accounts

on:
  workflow_dispatch:

jobs:
  check-faculty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check faculty accounts in PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          url = "".join(os.environ.get("DATABASE_URL", "").split())
          if url.startswith("postgres://"):
              url = url.replace("postgres://", "postgresql://", 1)

          if not url:
              raise RuntimeError("DATABASE_URL secret is empty.")

          parsed = make_url(url)
          if not parsed.host or not parsed.database:
              raise RuntimeError("Database host or name is missing.")

          engine = create_engine(url, pool_pre_ping=True)
          try:
              with engine.connect() as conn:
                  rows = conn.execute(
                      text("""
                          SELECT email, role, is_active
                          FROM users
                          WHERE lower(email) LIKE '%faculty%'
                      """)
                  ).fetchall()

                  print("Matching faculty-related records:")
                  if not rows:
                      print("No matching records found.")
                  for row in rows:
                      print(row)
          finally:
              engine.dispose()
          PY
