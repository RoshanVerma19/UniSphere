name: Reset Faculty Password

on:
  workflow_dispatch:

jobs:
  reset-password:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Reset faculty password in Render PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          from app.security import hash_password

          url = os.environ["DATABASE_URL"]
          if url.startswith("postgres://"):
              url = url.replace("postgres://", "postgresql://", 1)

          engine = create_engine(url, pool_pre_ping=True)
          try:
              with engine.begin() as conn:
                  result = conn.execute(
                      text("""
                          UPDATE users
                          SET hashed_password = :password_hash,
                              is_active = TRUE
                          WHERE lower(email) = :email
                            AND role = 'faculty'
                      """),
                      {
                          "password_hash": hash_password("FacultyPass123"),
                          "email": "faculty@example.com",
                      },
                  )
                  if result.rowcount != 1:
                      raise RuntimeError(
                          f"Expected one faculty account; updated {result.rowcount}. "
                          "No account was created."
                      )
                  print("Faculty password reset completed.")
          finally:
              engine.dispose()
          PY
